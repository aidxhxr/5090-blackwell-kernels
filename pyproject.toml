# Build is driven by setup.py (torch.utils.cpp_extension needs torch importable at build
# time, so we intentionally do not use an isolated PEP 517 build):
#     pip install -e . --no-build-isolation
[project]
name = "5090-blackwell-kernels"
version = "0.1.0"
description = "Hand-written CUDA kernels for LLM inference on the RTX 5090 (sm_120), with a GB10 (sm_121) build"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirkhan Aidarkhan" }]
dependencies = ["torch>=2.9", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "context"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["spark_kernels", "conftest", "shape_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
